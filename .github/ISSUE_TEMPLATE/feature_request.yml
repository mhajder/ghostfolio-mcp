name: Feature request
description: Suggest a new tool or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What do you want to do with Ghostfolio that the server cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For a new tool, describe its name, arguments and what it returns.
    validations:
      required: true
  - type: input
    id: api
    attributes:
      label: Ghostfolio API reference
      description: Link to the Ghostfolio API endpoint or docs this would use, if you know it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
