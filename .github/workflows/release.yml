name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.get_version.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from tag
        id: get_version
        run: |
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          TAG: ${{ steps.get_version.outputs.tag_name }}
          VERSION: ${{ steps.get_version.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # Same tags as docker/metadata-action in publish.yml: pre-releases only get the full version
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IMAGE_TAGS="\`$VERSION\`, \`${VERSION%.*}\`, \`${VERSION%%.*}\`"
          else
            IMAGE_TAGS="\`$VERSION\`"
          fi
          PKG_NAME=$(grep -m1 '^name' pyproject.toml | sed 's/.*= *"\(.*\)"/\1/')
          # cz bump wrote "## v1.2.3 (date)", release-please writes "## [1.2.3](compare-url) (date)"
          CHANGELOG=$(awk -v heading="## $TAG " -v rp_heading="## [$VERSION](" '
            index($0, heading) == 1 || index($0, rp_heading) == 1 { flag = 1; next }
            /^## / { if (flag) exit }
            flag && (started || NF) { started = 1; print }
          ' CHANGELOG.md)
          {
            echo "## Release $TAG"
            echo ""
            echo "### 🐳 Docker Image"
            echo ""
            echo "| Image | Tags |"
            echo "|-------|------|"
            echo "| \`$IMAGE\` | $IMAGE_TAGS, \`sha-${GITHUB_SHA::7}\` |"
            echo ""
            echo "### 🐍 Python Package"
            echo ""
            echo "- **Package:** \`$PKG_NAME==$VERSION\`"
            echo "- **Registry:** [PyPI](https://pypi.org/project/$PKG_NAME/$VERSION/)"
            echo ""
            echo "### 📋 Changelog"
            echo ""
            echo "${CHANGELOG:-No changelog entry found for this release.}"
          } > release_notes.md
          cat release_notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.get_version.outputs.tag_name }}
          PRERELEASE: ${{ contains(steps.get_version.outputs.tag_name, '-') }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release_notes.md --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release_notes.md --prerelease="$PRERELEASE"
          fi
