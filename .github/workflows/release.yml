name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version from tag
        id: get_version
        run: |
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          TAG: ${{ steps.get_version.outputs.tag_name }}
          VERSION: ${{ steps.get_version.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # Same tags as docker/metadata-action in publish.yml: pre-releases only get the full version
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IMAGE_TAGS="\`$VERSION\`, \`${VERSION%.*}\`, \`${VERSION%%.*}\`"
          else
            IMAGE_TAGS="\`$VERSION\`"
          fi
          PKG_NAME=$(grep -m1 '^name' pyproject.toml | sed 's/.*= *"\(.*\)"/\1/')
          CHANGELOG=$(awk -v heading="## $TAG " '
            index($0, heading) == 1 { flag = 1; next }
            /^## / { if (flag) exit }
            flag && (started || NF) { started = 1; print }
          ' CHANGELOG.md)
          {
            echo "## Release $TAG"
            echo ""
            echo "### 🐳 Docker Image"
            echo ""
            echo "| Image | Tags |"
            echo "|-------|------|"
            echo "| \`$IMAGE\` | $IMAGE_TAGS, \`sha-${GITHUB_SHA::7}\` |"
            echo ""
            echo "### 🐍 Python Package"
            echo ""
            echo "- **Package:** \`$PKG_NAME==$VERSION\`"
            echo "- **Registry:** [PyPI](https://pypi.org/project/$PKG_NAME/$VERSION/)"
            echo ""
            echo "### 📋 Changelog"
            echo ""
            echo "${CHANGELOG:-No changelog entry found for this release.}"
          } > release_notes.md
          cat release_notes.md

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: ${{ steps.get_version.outputs.tag_name }}
          body_path: release_notes.md
          prerelease: ${{ contains(steps.get_version.outputs.tag_name, '-') }}
